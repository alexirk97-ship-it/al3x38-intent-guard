[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "al3x38-intent-guard"
version = "1.0.1"
description = "Behavioral guardrail and intent-to-action verification layer for LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "al3x38"}]
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
offline = ["fastembed>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
