[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "al3x38-intent-guard"
version = "1.2.0"
description = "Behavioral guardrail, intent-to-action verification, and vector coherence compass for LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "al3x38"}]
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
offline = ["fastembed>=0.3.0"]

[project.urls]
Homepage = "https://github.com/alexirk97-ship-it/al3x38-intent-guard"
Repository = "https://github.com/alexirk97-ship-it/al3x38-intent-guard"
Issues = "https://github.com/alexirk97-ship-it/al3x38-intent-guard/issues"

[tool.setuptools.packages.find]
where = ["src"]
