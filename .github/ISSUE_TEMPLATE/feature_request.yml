name: Feature Request
description: Propose a new embedder adapter, threshold tuning, or vector invariant
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What bottleneck or agent safety scenario are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your idea while keeping zero heavy dependencies in core.
    validations:
      required: true