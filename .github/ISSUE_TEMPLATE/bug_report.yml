name: Bug Report / Guardrail False Positive
description: Report a bug, async error, or unexpected BLOCK/ALLOW verdict
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **`al3x38-intent-guard`**! Please provide enough context so we can reproduce the vector math or runtime behavior.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug or unexpected guardrail verdict (e.g., false positive BLOCK or bypassed prompt injection).
    validations:
      required: true
  - type: input
    id: embedder
    attributes:
      label: Embedder & Model Used
      description: Which embedder driver and model were you running?
      placeholder: "e.g., OllamaLocalEmbedder (bge-m3), OfflineFastEmbedder (MiniLM-L12-v2), OpenAICompatEmbedder (nomic-embed-text)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Snippet
      description: Paste a minimal Python snippet, prompt, and tool call that reproduces the issue.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment Versions
      placeholder: "e.g., al3x38-intent-guard 1.1.3, Python 3.11, Windows/Linux"